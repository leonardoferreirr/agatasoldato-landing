<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#F8F3EB" />
<title>One moment · Agata Medical Aesthetics</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<style>
@font-face{font-family:'Cormorant FB';src:local('Georgia');size-adjust:90.3%}
@font-face{font-family:'Cormorant FB2';src:local('Times New Roman');size-adjust:98.3%}
@font-face{font-family:'Montserrat FB';src:local('Arial'),local('Helvetica');size-adjust:112.6%}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/cormorant-500.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/cormorant-600.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/montserrat-400.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/montserrat-600.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{--ivory:#F8F3EB;--esp:#30231F;--esp-soft:#6B574E;--pom:#751D32;--pom-deep:#5C1626;--gold:#B58A52;--gold-ink:#7A5A30}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Montserrat","Montserrat FB",Arial,sans-serif;font-weight:400;background:var(--ivory);color:var(--esp);min-height:100svh;display:grid;place-items:center;padding:2rem;text-align:center}
.brand img{height:clamp(52px,9vw,72px);width:auto;margin:0 auto;display:block}
h1{font-family:"Cormorant Garamond","Cormorant FB","Cormorant FB2",Georgia,serif;font-weight:500;font-size:clamp(1.8rem,4.6vw,2.7rem);line-height:1.15;margin:2.4rem 0 .9rem}
h1 em{font-style:normal;font-weight:600;color:var(--pom)}
p{color:var(--esp-soft);font-size:.94rem;line-height:1.75;max-width:27rem;margin-inline:auto}
.dots{display:flex;gap:.45rem;justify-content:center;margin:2.2rem 0}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.28;animation:pulse 1.25s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
@keyframes pulse{0%,100%{opacity:.28;transform:scale(1)}45%{opacity:1;transform:scale(1.35)}}
.btn{display:inline-flex;align-items:center;gap:.7rem;margin-top:.6rem;font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:1.05rem 2rem;background:var(--pom);color:var(--ivory);border-radius:3px;text-decoration:none;transition:background .35s}
.btn:hover{background:var(--pom-deep)}
.back{display:block;margin-top:1.6rem;font-size:.64rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);text-decoration:none}
.back:hover{color:var(--pom)}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
</style>
</head>
<body>
<main>
  <a class="brand" href="index.html" aria-label="Agata Medical Aesthetics, home">
    <img src="assets/logo-ama.webp" width="560" height="283" alt="Agata Medical Aesthetics" />
  </a>
  <h1 id="h">Taking you to <em>the next step.</em></h1>
  <p id="p">This takes a second. If nothing happens, use the button below.</p>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <a class="btn" id="go" href="index.html#booking">Continue</a>
  <a class="back" id="back" href="index.html">Back to the site</a>
</main>
<script>
/* Keep these the same as index.html.
   BOOKING wins when both are filled: an external booking system is a
   better destination for a request than a chat thread. */
const PHONE   = '';
const BOOKING = '';

const q    = new URLSearchParams(location.search);
const lang = (q.get('l')||'en').slice(0,2);
const ctx  = (q.get('c')||'unknown').replace(/[^a-z_-]/gi,'').slice(0,24);

const T = {
  en:{h:'Taking you to <em>the next step.</em>',    p:'This takes a second. If nothing happens, use the button below.', b:'Continue',        k:'Back to the site'},
  pt:{h:'Levando você para <em>o próximo passo.</em>', p:'Leva um segundo. Se não abrir sozinho, use o botão abaixo.',    b:'Continuar',       k:'Voltar para o site'},
  es:{h:'Te llevamos al <em>siguiente paso.</em>',  p:'Tarda un segundo. Si no se abre solo, usa el botón de abajo.',   b:'Continuar',       k:'Volver al sitio'}
}[lang] || null;

if(T){
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
  document.getElementById('h').innerHTML   = T.h;
  document.getElementById('p').textContent = T.p;
  document.getElementById('go').textContent   = T.b;
  document.getElementById('back').textContent = T.k;
}

let msg = '';
try{ msg = sessionStorage.getItem('ama-msg') || ''; sessionStorage.removeItem('ama-msg'); }catch(e){}

const dest = BOOKING ? BOOKING
           : PHONE   ? 'https://wa.me/' + PHONE + (msg ? '?text=' + encodeURIComponent(msg) : '')
           : 'index.html#booking';
document.getElementById('go').href = dest;

window.dataLayer = window.dataLayer || [];
dataLayer.push({event:'booking_conversion', contexto:ctx, idioma:lang});

setTimeout(() => location.replace(dest), 1800);
</script>
</body>
</html>
